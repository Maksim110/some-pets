[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-pet"
version = "0.1.0"
description = "A compact FLUX DreamBooth LoRA pet project with data prep, training wrapper, inference, and lightweight evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "accelerate>=1.0.0",
    "datasets>=2.20.0",
    "diffusers @ git+https://github.com/huggingface/diffusers.git",
    "ftfy>=6.2.0",
    "huggingface-hub>=0.25.0",
    "Jinja2>=3.1.0",
    "peft>=0.13.0",
    "prodigyopt>=1.0",
    "safetensors>=0.4.5",
    "tensorboard>=2.17.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "tqdm>=4.66.0",
    "transformers>=4.45.0",
]
eval = [
    "torch>=2.4.0",
    "transformers>=4.45.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
lora-pet = "lora_pet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
